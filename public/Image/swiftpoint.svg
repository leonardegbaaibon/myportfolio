<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f8f9fc" />
      <stop offset="100%" stopColor="#e5e8f0" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Tile -->
  <rect x="30" y="20" width="340" height="340" rx="95" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#ffffff" stroke-width="2" />

  <!-- SwiftPoint 'S' Icon -->
  <g fill="#1a1d36">
    <!-- Top Swept Crescent -->
    <path d="M 235 95 
             C 165 95, 115 130, 115 180 
             C 115 210, 135 228, 165 235
             C 178 220, 192 208, 210 203
             C 192 195, 180 180, 180 162
             C 180 138, 202 120, 230 120
             C 255 120, 275 132, 280 152
             C 283 140, 282 125, 278 115
             C 268 102, 252 95, 235 95 Z" />

    <!-- Bottom Swept Crescent (Rotational Symmetry) -->
    <path d="M 165 285 
             C 235 285, 285 250, 285 200 
             C 285 170, 265 152, 235 145
             C 222 160, 208 172, 190 177
             C 208 185, 220 200, 220 218
             C 220 242, 198 260, 170 260
             C 145 260, 125 248, 120 228
             C 117 240, 118 255, 122 265
             C 132 278, 148 285, 165 285 Z" />

    <!-- Center Aperture Dot Accent -->
    <circle cx="200" cy="190" r="16" fill="#f0f2f7" />
  </g>

  <!-- SwiftPoint Typography -->
  <text x="200" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    SwiftPoint
  </text>
</svg>
